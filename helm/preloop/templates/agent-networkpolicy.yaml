{{- if .Values.agentExecution.networkPolicy.enabled -}}
{{- $np := .Values.agentExecution.networkPolicy -}}
{{- $agentNamespace := .Values.agentExecution.namespace.create | ternary .Values.agentExecution.namespace.name .Release.Namespace -}}
{{- $clusterCidrs := $np.clusterCidrs | default $np.excludeCIDRs -}}
{{- $extraEgress := $np.extraEgress | default $np.additionalEgressRules -}}
{{- $controlPlanePorts := $np.controlPlanePorts | default (list 80 8000) -}}
---
# Agent execution isolation.
#
# Agent pods run untrusted, model-authored code. They are labelled
# app=agent-execution by the executor
# (backend/preloop/agents/container.py, pod template labels), whether they
# land in a dedicated namespace or in the release namespace, so this policy
# selects that label rather than the whole namespace and holds in both
# topologies.
#
# Egress is an allow list: DNS, the Preloop control plane (MCP plus the
# model gateway), the public internet, and whatever the operator adds. The
# database, NATS, the console, and other agent pods are not on it.
#
# Ingress is denied outright. Nothing dials an agent pod: results and logs
# leave through the pod log stream that the runner reads from the API
# server, and checkpoints and evidence are pushed out by the pod itself
# (backend/preloop/services/checkpoint_runtime.py).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "preloop.fullname" . }}-agent-execution
  namespace: {{ $agentNamespace }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-execution
spec:
  podSelector:
    matchLabels:
      app: agent-execution

  policyTypes:
    - Ingress
    - Egress

  # INGRESS: deny all. An empty rule list means "no source is allowed".
  ingress: []

  egress:
    # DNS. Without this nothing else resolves.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    {{- if $np.allowPreloopAPI }}
    # Control plane: MCP tools on the API, model calls on the gateway.
    #
    # Both the service port (80) and the container port (8000) are allowed:
    # a ClusterIP connection is translated to the backing pod IP and its
    # target port before policy is evaluated on most CNIs, so a rule that
    # only names 80 drops the traffic it meant to permit.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "preloop.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "preloop.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: gateway
      ports:
        {{- range $controlPlanePorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}

    {{- if $np.allowExternalLLMAPIs }}
    # The public internet: model providers, git remotes, package registries.
    # Everything inside the cluster is carved out, so this rule cannot be
    # used to reach the database, NATS, or another tenant's agent pod.
    {{- if not $clusterCidrs }}
    {{- fail "agentExecution.networkPolicy.clusterCidrs must list the cluster pod and service CIDRs when allowExternalLLMAPIs is true (kubectl cluster-info dump | grep -E 'cluster-cidr|service-cluster-ip-range')" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range $clusterCidrs }}
              - {{ . | quote }}
              {{- end }}
      {{- with $np.internetPorts }}
      ports:
        {{- range . }}
        - protocol: {{ .protocol | default "TCP" }}
          port: {{ .port }}
        {{- end }}
      {{- end }}
    {{- end }}

    {{- with $extraEgress }}
    # Operator-supplied rules (an in-cluster registry, a node-local DNS
    # cache on a link-local address, a private artifact store).
    {{- toYaml . | nindent 4 }}
    {{- end }}

{{- if .Values.agentExecution.namespace.create }}
---
# Default deny for every other pod in the dedicated agent namespace.
# NetworkPolicies are additive, so this rule set (deny both directions,
# no exceptions) leaves the allow list above untouched for agent pods and
# isolates anything else that lands in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-execution-isolation
  namespace: {{ $agentNamespace }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-execution
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
{{- end }}
{{- end }}
{{- if and .Values.agentExecution.namespace.create .Values.agentExecution.networkPolicy.enabled }}
{{- $agentNamespace := .Values.agentExecution.namespace.name }}
---
# ResourceQuota for agent execution namespace - prevent resource exhaustion
# Only created when using a separate namespace for agent execution
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-execution-quota
  namespace: {{ $agentNamespace }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-execution
spec:
  hard:
    # Limit number of concurrent agent Jobs
    count/jobs.batch: {{ .Values.agentExecution.resourceQuota.maxJobs | quote }}
    # Limit number of concurrent Pods
    pods: {{ .Values.agentExecution.resourceQuota.maxPods | quote }}
    # Total CPU requests across all pods
    requests.cpu: {{ .Values.agentExecution.resourceQuota.requestsCpu | quote }}
    # Total memory requests across all pods
    requests.memory: {{ .Values.agentExecution.resourceQuota.requestsMemory | quote }}
    # Total CPU limits across all pods
    limits.cpu: {{ .Values.agentExecution.resourceQuota.limitsCpu | quote }}
    # Total memory limits across all pods
    limits.memory: {{ .Values.agentExecution.resourceQuota.limitsMemory | quote }}

---
# LimitRange for agent execution namespace - enforce pod-level resource constraints
# Only created when using a separate namespace for agent execution
apiVersion: v1
kind: LimitRange
metadata:
  name: agent-execution-limits
  namespace: {{ $agentNamespace }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-execution
spec:
  limits:
    # Constraints for containers
    - type: Container
      max:
        cpu: {{ .Values.agentExecution.limitRange.container.maxCpu | quote }}
        memory: {{ .Values.agentExecution.limitRange.container.maxMemory | quote }}
      min:
        cpu: {{ .Values.agentExecution.limitRange.container.minCpu | quote }}
        memory: {{ .Values.agentExecution.limitRange.container.minMemory | quote }}
      default:
        cpu: {{ .Values.agentExecution.limitRange.container.defaultCpu | quote }}
        memory: {{ .Values.agentExecution.limitRange.container.defaultMemory | quote }}
      defaultRequest:
        cpu: {{ .Values.agentExecution.limitRange.container.defaultRequestCpu | quote }}
        memory: {{ .Values.agentExecution.limitRange.container.defaultRequestMemory | quote }}
    # Constraints for pods
    - type: Pod
      max:
        cpu: {{ .Values.agentExecution.limitRange.pod.maxCpu | quote }}
        memory: {{ .Values.agentExecution.limitRange.pod.maxMemory | quote }}
{{- end }}
