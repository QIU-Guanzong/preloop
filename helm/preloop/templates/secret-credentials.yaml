{{- $smtp := .Values.config.smtp -}}
{{- $urlFromSecret := .Values.database.urlFromSecret | default dict -}}
{{- $smtpSecret := $smtp.passwordSecret | default dict -}}
{{- $needsDatabaseUrl := not $urlFromSecret.name -}}
{{- $needsSmtpPassword := and $smtp.host (not $smtpSecret.name) -}}
{{- if or $needsDatabaseUrl $needsSmtpPassword }}
# Credentials the chart builds from values, kept out of the pod spec.
#
# Env values are readable by anyone who can `kubectl get deployment` or
# read the pod spec, which is a wider audience than `kubectl get secret`
# in most RBAC setups, and they end up in `helm get manifest` output and
# in any rendered manifest checked into git. A Secret plus secretKeyRef
# is the same value with a narrower blast radius; supply your own Secret
# with database.urlFromSecret / config.smtp.passwordSecret to keep the
# credential out of values entirely.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "preloop.credentialsSecretName" . }}
  labels:
    {{- include "preloop.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $needsDatabaseUrl }}
  database-url: {{ include "preloop.databaseUrl" . | quote }}
  {{- end }}
  {{- if $needsSmtpPassword }}
  smtp-password: {{ $smtp.password | default "" | quote }}
  {{- end }}
{{- end }}
