# Trial: run a Preloop flow from GitHub Actions with the CLI.
#
# Two ways in, both opt-in so the webhook-driven reviewer is not doubled:
#   1. Add the label `preloop-ci-review` to a pull request.
#   2. Run the workflow by hand with a pull request number.
#
# The CLI blocks while the execution runs (stdin is not a TTY), streams the
# execution log into this job, and exits non-zero on FAILED, STOPPED or
# TIMEOUT, so the check goes red when the review does. Compute stays where the
# flow says (hosted, or a private runner via `runner_pool`); this job only
# triggers and waits. See docs/guide/flows/ci-trigger.md.
#
# Required repository settings:
#   secret   PRELOOP_TOKEN  least-privilege account API token scoped to the
#                           review flow (not a personal admin token). This job
#                           cannot rotate the secret; keep the account's grants
#                           narrow enough that a mis-applied label is recoverable.
#   variable PRELOOP_URL    optional, defaults to https://preloop.ai
#   variable PRELOOP_FLOW   optional, flow id or name, defaults to "Pull Request Reviewer"
name: Preloop flow trigger

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preloop-flow-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  trigger:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'preloop-ci-review'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # This job only needs scripts/install-cli.sh. Check out the default
      # branch so a labeled PR cannot supply the installer (or a replacement
      # preloop binary) that then runs with PRELOOP_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the Preloop CLI
        env:
          # Pin the downloaded release. install-cli.sh from the default
          # branch already fetches SHA256SUMS; the check below fails the
          # job on a mismatch because the installer only warns.
          PRELOOP_VERSION: "0.15.0"
          INSTALL_DIR: ${{ runner.temp }}/preloop-bin
        run: |
          set -euo pipefail
          mkdir -p "$INSTALL_DIR"
          sh scripts/install-cli.sh
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch ${arch}" >&2; exit 1 ;;
          esac
          asset="preloop-${os}-${arch}"
          sums="${RUNNER_TEMP}/SHA256SUMS"
          curl -fsSL "https://github.com/preloop/preloop/releases/download/v${PRELOOP_VERSION}/SHA256SUMS" -o "$sums"
          expected="$(awk -v asset="$asset" '$2 == asset || $2 == "*" asset { print $1; exit }' "$sums")"
          actual="$(sha256sum "${INSTALL_DIR}/preloop" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "SHA256 mismatch for ${asset}: expected ${expected:-missing}, got ${actual}" >&2
            exit 1
          fi

      - name: Resolve PR head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_HEAD}" ]; then
            echo "HEAD_SHA=${PR_HEAD}" >> "$GITHUB_ENV"
          else
            echo "HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)" >> "$GITHUB_ENV"
          fi

      - name: Trigger the flow and wait for the verdict
        env:
          PRELOOP_TOKEN: ${{ secrets.PRELOOP_TOKEN }}
          PRELOOP_URL: ${{ vars.PRELOOP_URL || 'https://preloop.ai' }}
          PRELOOP_FLOW: ${{ vars.PRELOOP_FLOW || 'Pull Request Reviewer' }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/pull/{1}', github.event.repository.html_url, inputs.pr) }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${PRELOOP_TOKEN}" ]; then
            echo "PRELOOP_TOKEN secret is not set" >&2
            exit 1
          fi
          payload=$(jq -cn --arg url "$PR_URL" --argjson number "$PR_NUMBER" \
            --arg repo "$GH_REPO" --arg sha "$HEAD_SHA" \
            '{pull_request: {url: $url, number: $number, head_sha: $sha}, repository: {full_name: $repo}, source: "github-actions"}')
          echo "$payload" | preloop flow trigger "$PRELOOP_FLOW" --payload - --timeout 40m
